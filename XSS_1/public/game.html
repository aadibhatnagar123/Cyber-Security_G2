<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Details - GameStore</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">🛒 GameStore</a>
    <span id="mode-badge"></span>
    <button id="toggle-btn">Toggle Fix</button>
    <div style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
      <a href="/profile.html">My Profile</a>
      <a href="/login.html" style="background: #6cf; color: #000; padding: 6px 12px; border-radius: 4px; font-weight: bold;">Sign In</a>
    </div>
  </header>
  <main>
    <div id="game-header"></div>
    <hr style="border-color:#333; margin: 2rem 0;">
    
    <h3>Customer Reviews</h3>
    <div id="comments"></div>

    <h3 style="margin-top: 2rem;">Leave a Review</h3>
    <form id="comment-form">
      <input name="name" id="c-name" placeholder="Your Name" maxlength="50">
      <textarea name="text" id="c-text" rows="4" placeholder="Write your review..."></textarea>
      <button type="submit" style="width: auto;">Submit Review</button>
    </form>
  </main>
  <script src="/game.js"></script>
</body>
</html>
