<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Profile - GameStore</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">🛒 GameStore</a>
    <div style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
      <a href="/">Store</a>
    </div>
  </header>
  <main>
    <h2>My Account</h2>
    <div class="profile-box">
      <h3>Welcome back, John Doe</h3>
      <p>Email: john.doe@example.com</p>
      
      <h4 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px;">Saved Payment Methods</h4>
      <div class="cc">
        <strong>1234 5678 0000 1111</strong><br>
        Expires: 12/2026<br>
        Name on card: John Doe
        CVV: 678
      </div>
    </div>
  </main>
  <script>
    // Check if logged in
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "/login.html";
    }
    
    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "/";
    }
  </script>
</body>
</html>
